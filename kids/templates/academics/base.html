{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Record Books</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f6f9; }
        .book-card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); border-left:4px solid #0d6efd; height:100%; }
        .a-red { background:#ffe2e2 !important; color:#b10000 !important; font-weight:bold; }
        .s-orange { background:#fff0d6 !important; color:#9a5b00 !important; font-weight:bold; }
    </style>
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="fw-bold mb-4">School Record Books</h2>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
